# S24 Ultra tuned Termux settings (previous file: termux.properties.bak-*).
# Termux reads this file as ISO-8859-1, so symbols are written as unicode escapes.

# Dark app chrome (sessions drawer, dialogs) regardless of the system theme.
night-mode = true

# One compact row of extra keys so landscape + soft keyboard still leaves a
# usable terminal. Swipe up on a key for its popup:
#   ESC -> ~, TAB -> |, arrows -> HOME/PGDN/PGUP/END, ^C -> ^D
# The menu (sessions drawer, with a close button per session) and the keyboard
# toggle stay one tap away for when the keyboard is stuck.
terminal-toolbar-height = 0.9
extra-keys-text-all-caps = false
extra-keys = [[ \
  {key: DRAWER, display: '\u2630'}, {key: KEYBOARD, display: '\u2328'}, \
  {key: ESC, display: 'Esc', popup: '~'}, \
  {key: TAB, popup: '|'}, \
  {key: CTRL, display: 'Ctrl'}, {key: ALT, display: 'Alt'}, \
  {key: LEFT, popup: HOME}, \
  {key: DOWN, popup: PGDN}, \
  {key: UP, popup: PGUP}, \
  {key: RIGHT, popup: END}, \
  {macro: 'CTRL c', display: '^C', popup: {macro: 'CTRL d', display: '^D'}} \
]]

# Keep text off the rounded screen edges without wasting cells.
terminal-margin-horizontal = 4
terminal-margin-vertical = 2

terminal-cursor-style = bar
terminal-cursor-blink-rate = 500
